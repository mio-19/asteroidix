BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "asteroidix-nightly"
BBFILE_PATTERN_asteroidix-nightly = "^${LAYERDIR}/"
BBFILE_PRIORITY_asteroidix-nightly = "99"

LAYERDEPENDS_asteroidix-nightly = "core asteroidix"
LAYERSERIES_COMPAT_asteroidix-nightly = "whinlatter"

MACHINE_HAS_WLAN:hoki = "true"
