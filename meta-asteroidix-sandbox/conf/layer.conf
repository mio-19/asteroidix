BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "asteroidix-sandbox"
BBFILE_PATTERN_asteroidix-sandbox = "^${LAYERDIR}/"
BBFILE_PRIORITY_asteroidix-sandbox = "99"

LAYERDEPENDS_asteroidix-sandbox = "core"
LAYERSERIES_COMPAT_asteroidix-sandbox = "walnascar whinlatter"
