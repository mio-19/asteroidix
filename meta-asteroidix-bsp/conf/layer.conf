BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "asteroidix-bsp"
BBFILE_PATTERN_asteroidix-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_asteroidix-bsp = "95"

LAYERDEPENDS_asteroidix-bsp = "core"
LAYERSERIES_COMPAT_asteroidix-bsp = "whinlatter"
