BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "asteroidix-custom"
BBFILE_PATTERN_asteroidix-custom = "^${LAYERDIR}/"
BBFILE_PRIORITY_asteroidix-custom = "99"

LAYERDEPENDS_asteroidix-custom = "core"
LAYERSERIES_COMPAT_asteroidix-custom = "whinlatter"
