<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root daemon can own the OTA service -->
  <policy user="root">
    <allow own="org.asteroidos.OTA1"/>
    <allow send_destination="org.asteroidos.OTA1"/>
    <allow receive_sender="org.asteroidos.OTA1"/>
  </policy>

  <!-- Default user ceres can query and control the OTA service -->
  <policy user="ceres">
    <allow send_destination="org.asteroidos.OTA1"/>
    <allow receive_sender="org.asteroidos.OTA1"/>
  </policy>

  <policy context="default">
    <deny send_destination="org.asteroidos.OTA1"/>
  </policy>
</busconfig>
