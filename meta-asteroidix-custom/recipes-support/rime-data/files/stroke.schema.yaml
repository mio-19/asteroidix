# Rime schema
# encoding: utf-8

schema:
  schema_id: stroke
  name: "五笔画"
  version: "0.6"
  author:
    - 四季的风
    - 雪斋
  description: |
    五笔画输入法
    按横h竖s撇p捺n折z（或点d）五种基本笔画输入汉字

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz12345"
  delimiter: " '"

menu:
  page_size: 5

translator:
  dictionary: stroke
  preedit_format:
    - xlit/hspnzd12345/一丨丿丶乙丶一丨丿丶乙/
