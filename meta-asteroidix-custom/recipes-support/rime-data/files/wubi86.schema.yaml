# Rime schema
# encoding: utf-8

schema:
  schema_id: wubi86
  name: "五笔字型86版"
  version: "0.21"
  author:
    - 王永民
  description: |
    五笔字型86版

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

menu:
  page_size: 5

translator:
  dictionary: wubi86
