# Rime schema
# encoding: utf-8

schema:
  schema_id: luna_pinyin
  name: "朙月拼音"
  version: "0.22"
  author:
    - 佛振 <chen.sst@gmail.com>
  description: |
    Rime 預設拼音輸入方案「朙月拼音」

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

menu:
  page_size: 5

translator:
  dictionary: pinyin_simp
